<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Could your company run without you?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: questions and the send form on the left, a sticky result panel on the right; on phones: questions, result, send. Palette follows the sales deck: ink + signal red. */
  --bg: #f4f5f6;
  --surface: #ffffff;
  --ink: #12161b;
  --muted: #5d656d;
  --line: #dfe2e5;
  --accent: #c8452d;
  --selected: #eceef0;
  --good: #2f7d57;
  --warn: #b7791f;
  --bad: #c8452d;
  --panel: #12161b;
  --panel-ink: #f2f3f4;
  --panel-muted: #9ba3ab;
  --panel-line: #2a3138;
  --font-display: "Archivo", "IBM Plex Sans", "Noto Sans Georgian", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Noto Sans Georgian", "Segoe UI", Calibri, Arial, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1115; --surface: #171b21; --ink: #eef0f2; --muted: #9aa2aa; --line: #2a3139;
    --accent: #e0583f; --selected: #252b33; --good: #4fb383; --warn: #e0a640; --bad: #e0583f;
    --panel: #1d232a; --panel-ink: #f2f3f4; --panel-muted: #9ba3ab; --panel-line: #313942;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1115; --surface: #171b21; --ink: #eef0f2; --muted: #9aa2aa; --line: #2a3139;
  --accent: #e0583f; --selected: #252b33; --good: #4fb383; --warn: #e0a640; --bad: #e0583f;
  --panel: #1d232a; --panel-ink: #f2f3f4; --panel-muted: #9ba3ab; --panel-line: #313942;
  color-scheme: dark;
}
:root[lang="ka"] { --font-display: "Noto Sans Georgian", "IBM Plex Sans", Arial, sans-serif; --font-body: "Noto Sans Georgian", "IBM Plex Sans", Arial, sans-serif; }
:root[lang="ka"] .eyebrow, :root[lang="ka"] .q-area, :root[lang="ka"] .pill, :root[lang="ka"] .panel h2, :root[lang="ka"] .next h3 { text-transform: none; letter-spacing: .02em; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 48px; }
header { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
.eyebrow { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.eyebrow::before { content: ""; width: 8px; height: 8px; background: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 4.4vw, 46px); line-height: 1.1; margin: 8px 0 8px; text-wrap: balance; max-width: 22ch; }
:root[lang="ka"] h1, :root[lang="ru"] h1 { max-width: 28ch; }
.lede { color: var(--muted); margin: 0; max-width: 62ch; font-size: 17px; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 12px 20px; font-size: 16px; }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .6; cursor: progress; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: transparent; padding: 9px 12px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.howto { list-style: none; margin: 0 0 20px; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; counter-reset: step; }
@media (max-width: 700px) { .howto { grid-template-columns: 1fr; } }
.howto li { counter-increment: step; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; font-size: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.howto li::before { content: counter(step); width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
.howto li:last-child::before { background: var(--accent); color: #fff; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-areas: "q r" "s r"; gap: 24px; align-items: start; }
.area-q { grid-area: q; } .area-r { grid-area: r; } .area-s { grid-area: s; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; grid-template-areas: "q" "r" "s"; } }

.questions { display: grid; gap: 14px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
.q-head { display: flex; gap: 14px; align-items: flex-start; }
.q-num { font-family: var(--font-display); font-weight: 800; font-size: 15px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--line); flex: none; }
.q.answered .q-num { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.q-area { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.q-text { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.35; margin: 2px 0 0; text-wrap: balance; }
.opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
@media (max-width: 600px) { .opts { grid-template-columns: 1fr; } }
.opt { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 12px 12px 12px 40px; cursor: pointer; min-height: 56px; position: relative; font-size: 14px; line-height: 1.35; display: flex; align-items: center; }
.opt::before { content: ""; position: absolute; left: 14px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.opt:hover { border-color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--ink); background: var(--selected); font-weight: 600; }
.opt[aria-pressed="true"]::before { border-color: var(--ink); background: var(--ink); box-shadow: inset 0 0 0 3px var(--surface); }

.panel { position: sticky; top: 16px; background: var(--panel); color: var(--panel-ink); border-radius: var(--radius); padding: 22px; display: grid; gap: 18px; }
.panel h2 { font-family: var(--font-display); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--panel-muted); margin: 0; font-weight: 700; }
.score-row { display: flex; align-items: baseline; gap: 10px; }
.score { font-family: var(--font-display); font-weight: 800; font-size: 72px; line-height: .9; font-variant-numeric: tabular-nums; }
.score-of { color: var(--panel-muted); font-size: 18px; }
.progress { font-size: 13px; color: var(--panel-muted); }
.scale { position: relative; height: 10px; display: grid; grid-template-columns: 4fr 3fr 4fr; gap: 3px; }
.scale span { border-radius: 3px; opacity: .35; }
.scale span:nth-child(1) { background: var(--good); }
.scale span:nth-child(2) { background: var(--warn); }
.scale span:nth-child(3) { background: var(--bad); }
.scale span.on { opacity: 1; }
.marker { position: absolute; top: -5px; width: 4px; height: 20px; background: var(--panel-ink); border-radius: 2px; transition: left .3s ease; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
.pill.good { background: var(--good); color: #fff; }
.pill.warn { background: var(--warn); color: #1a1205; }
.pill.bad { background: var(--bad); color: #fff; }
.pill.none { background: var(--panel-line); color: var(--panel-muted); }
.verdict { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.3; margin: 10px 0 6px; text-wrap: balance; }
.reco { color: var(--panel-muted); margin: 0; font-size: 15px; }
.next { border-top: 1px solid var(--panel-line); padding-top: 16px; }
.next h3 { margin: 0 0 6px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.next p { margin: 0; font-size: 15px; }
.next[hidden], .focus[hidden] { display: none; }
.risks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.risks li { display: grid; grid-template-columns: 10px 1fr; gap: 10px; font-size: 14px; align-items: start; }
.dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
.dot.v2 { background: var(--bad); } .dot.v1 { background: var(--warn); }
.risks .empty { color: var(--panel-muted); grid-column: 1 / -1; }
.focus label { font-size: 14px; color: var(--panel-ink); font-weight: 600; display: block; margin-bottom: 6px; }
.focus select { width: 100%; background: var(--panel); color: var(--panel-ink); border: 1px solid var(--panel-line); border-radius: 8px; padding: 9px 10px; }
.to-send { background: none; border: 0; padding: 16px 0 0; font-family: inherit; border-top: 1px solid var(--panel-line); text-align: left; cursor: pointer; width: 100%; font-size: 15px; color: var(--panel-ink); font-weight: 600; text-decoration: none; border-top: 1px solid var(--panel-line); padding-top: 16px; display: flex; justify-content: space-between; gap: 10px; }
.to-send span:last-child { color: var(--accent); }
.to-send:hover span:first-child { text-decoration: underline; }

.send { background: var(--surface); border: 2px solid var(--accent); border-radius: var(--radius); padding: 24px; display: grid; gap: 16px; }
.send h2 { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.2; margin: 0; text-wrap: balance; }
.send-text { margin: 0; color: var(--muted); max-width: 62ch; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 600px) { .fields { grid-template-columns: 1fr; } }
.fields .wide { grid-column: 1 / -1; }
label.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; }
.field input, .field textarea { border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px; background: var(--bg); width: 100%; }
.field textarea { min-height: 90px; resize: vertical; }
.send-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.privacy { font-size: 13px; color: var(--muted); margin: 0; }
.msg { font-size: 14px; margin: 0; padding: 12px 14px; border-radius: 8px; }
.msg[hidden] { display: none; }
.msg.error { background: var(--selected); border-left: 0; color: var(--ink); }
.msg.ok { background: var(--good); color: #fff; font-weight: 600; }
.fallback { display: grid; gap: 10px; background: var(--selected); border-radius: 8px; padding: 14px; font-size: 14px; }
.fallback[hidden] { display: none; }
.fallback-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.addr { font-weight: 600; user-select: all; }

.foot { margin-top: 28px; color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .marker { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="t-eyebrow"></div>
      <h1 id="t-title"></h1>
      <p class="lede" id="t-lede"></p>
    </div>
    <div class="top-actions">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-en" title="English">EN</button>
        <button type="button" id="lang-de" title="Deutsch">DE</button>
        <button type="button" id="lang-ka" title="ქართული">KA</button>
        <button type="button" id="lang-ru" title="Русский">RU</button>
      </div>
      <button type="button" class="btn" id="btn-restart"></button>
    </div>
  </header>

  <ol class="howto" id="howto"></ol>

  <div class="grid">
    <main class="area-q">
      <div class="questions" id="questions"></div>
    </main>

    <aside class="panel area-r" aria-live="polite">
      <h2 id="t-result"></h2>
      <div>
        <div class="score-row"><span class="score" id="score">0</span><span class="score-of">/ 10</span></div>
        <div class="progress" id="progress"></div>
      </div>
      <div class="scale" aria-hidden="true"><span id="b0"></span><span id="b1"></span><span id="b2"></span><div class="marker" id="marker"></div></div>
      <div>
        <span class="pill none" id="pill"></span>
        <p class="verdict" id="verdict"></p>
        <p class="reco" id="reco"></p>
      </div>
      <div class="next">
        <h3 id="t-next"></h3>
        <p id="next"></p>
      </div>
      <div>
        <h2 id="t-risks" style="margin-bottom:10px"></h2>
        <ul class="risks" id="risks"></ul>
      </div>
      <div class="focus" id="focus-box">
        <label for="f-focus" id="t-focus"></label>
        <select id="f-focus"></select>
      </div>
      <div class="next" id="pilot-box">
        <h3 id="t-pilot"></h3>
        <p id="pilot"></p>
      </div>
      <button type="button" class="to-send" id="to-send"><span id="t-tosend"></span><span aria-hidden="true">↓</span></button>
    </aside>

    <section class="send area-s" id="send-form" aria-labelledby="t-sendtitle">
      <h2 id="t-sendtitle"></h2>
      <p class="send-text" id="t-sendtext"></p>
      <form id="form" novalidate>
        <input type="checkbox" name="botcheck" id="h-bot" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="fields">
          <label class="field" for="f-name"><span id="t-name"></span><input id="f-name" name="name" type="text" autocomplete="name" required></label>
          <label class="field" for="f-company"><span id="t-company"></span><input id="f-company" name="company" type="text" autocomplete="organization"></label>
          <label class="field" for="f-email"><span id="t-email"></span><input id="f-email" name="email" type="email" autocomplete="email" required></label>
          <label class="field" for="f-phone"><span id="t-phone"></span><input id="f-phone" name="phone" type="tel" autocomplete="tel"></label>
          <label class="field wide" for="f-message"><span id="t-message"></span><textarea id="f-message" name="message"></textarea></label>
        </div>
        <div class="send-row" style="margin-top:16px">
          <button type="submit" class="btn primary" id="btn-send"></button>
          <p class="privacy" id="t-privacy"></p>
        </div>
      </form>
      <p class="msg error" id="err" role="alert" hidden></p>
      <p class="msg ok" id="ok" role="status" hidden></p>
      <div class="fallback" id="fallback" hidden>
        <span id="t-fallback"></span>
        <div class="fallback-actions">
          <a class="btn" id="mailto" href="mailto:gkhazhomia@gmail.com"><span id="t-openmail"></span></a>
          <button type="button" class="btn" id="btn-copy"></button>
          <span class="addr">gkhazhomia@gmail.com</span>
          <span class="privacy" id="copy-status" role="status"></span>
        </div>
      </div>
    </section>
  </div>
  <p class="foot">George Khazhomia · gkhazhomia@gmail.com · +41 77 279 62 50</p>
</div>

      { area: "Новые сотрудники", text: "Как новый сотрудник осваивает свою работу?", opts: ["По письменным инструкциям и чек-листу", "По документам и рядом с опытным коллегой", "Наблюдая и расспрашивая коллег"], risk: "Новым сотрудникам нужны месяцы, чтобы выйти на полную продуктивность", pilot: "Руководство по адаптации и чек-лист первых 30 дней для самой распространённой должности" },

      { area: "Стоимость", text: "Если бы покупатель или преемник попросил сегодня показать, как работает ваша компания, что вы могли бы ему показать?", opts: ["Описанные процессы", "Некоторые документы", "Ничего, пришлось бы объяснять самому"], risk: "Сегодня компанию невозможно передать или продать", pilot: "Карта десяти ключевых процессов и пакет передачи дел" }
    ],
    send: {
      title: "Бесплатная 15-минутная консультация",
      text: "Отправьте свой результат, и George Khazhomia свяжется с вами, чтобы назначить бесплатный 15-минутный разговор о том, с чего лучше начать вашей компании.",
      name: "Ваше имя", company: "Компания", email: "Эл. почта", phone: "Телефон (необязательно)", message: "Сообщение (необязательно)",
      messagePh: "Например: планируем передать бизнес через три года.",
      privacy: "Ваши ответы получит только George Khazhomia, они никому не передаются.",
      button: "Отправить результат", sending: "Отправка…",
      needAnswers: "Сначала ответьте на все пять вопросов.", needContact: "Укажите имя и действующий адрес эл. почты.",
      sent: "Спасибо. Ваш результат отправлен. George Khazhomia свяжется с вами, чтобы назначить бесплатную консультацию.",
      fallback: "Браузеру не удалось отправить сообщение напрямую. Откройте почтовую программу или скопируйте сообщение и отправьте его на адрес:",
      openMail: "Открыть почту", copy: "Скопировать сообщение", copied: "Сообщение скопировано", copyFail: "Не удалось скопировать. Выделите текст вручную.",
      subject: "Результат экспресс-теста",
      labels: { name: "Имя", company: "Компания", email: "Эл. почта", phone: "Телефон", message: "Сообщение", score: "Баллы", result: "Результат", worry: "Главная забота", start: "С чего начать", answers: "Ответы" }
    }
  }
};

const LANGS = ["en", "de", "ka", "ru"];
let lang = "en";
let state = { answers: [null, null, null, null, null], focus: "auto" };

const $ = (id) => document.getElementById(id);
const T = () => I18N[lang];

// Scoring stays internal: each answer is worth 0, 1 or 2 by its position. Bands: 0–3, 4–6, 7–10.
function evaluate(answers) {
  const answered = answers.filter((a) => a !== null).length;
  const total = answers.reduce((s, a) => s + (a ?? 0), 0);
  const band = answered < 5 ? null : total <= 3 ? 0 : total <= 6 ? 1 : 2;
  return { answered, total, band };
}

function riskIndexes(answers) {
  return answers.map((v, i) => ({ v, i }))
    .filter((x) => x.v !== null && x.v > 0)
    .sort((a, b) => b.v - a.v || a.i - b.i);
}

function focusIndex() {
  if (state.focus !== "auto") return Number(state.focus);
  const r = riskIndexes(state.answers);
  return r.length ? r[0].i : null;
}

function renderQuestions() {
  const box = $("questions");
  box.innerHTML = "";
  T().questions.forEach((q, i) => {
    const el = document.createElement("section");
    el.className = "q" + (state.answers[i] !== null ? " answered" : "");
    el.setAttribute("aria-labelledby", `q${i}-text`);
    el.innerHTML = `
      <div class="q-head">
        <span class="q-num">${i + 1}</span>
        <div><div class="q-area">${q.area}</div><p class="q-text" id="q${i}-text">${q.text}</p></div>
      </div>
      <div class="opts" role="group" aria-labelledby="q${i}-text"></div>`;
    const opts = el.querySelector(".opts");
    q.opts.forEach((label, v) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      b.id = `q${i}-o${v}`;
      b.setAttribute("aria-pressed", state.answers[i] === v ? "true" : "false");
      b.textContent = label;
      b.addEventListener("click", () => {
        state.answers[i] = state.answers[i] === v ? null : v;
        renderQuestions();
        renderResult();
      });
      opts.appendChild(b);
    });
    box.appendChild(el);
  });
}

function renderFocusOptions() {
  const t = T();
  $("f-focus").innerHTML = `<option value="auto">${t.focusAuto}</option>` +
    t.questions.map((q, i) => `<option value="${i}">${i + 1}. ${q.area}</option>`).join("");
  $("f-focus").value = state.focus;
}

function renderResult() {
  const t = T();
  const { answered, total, band } = evaluate(state.answers);
  $("score").textContent = total;
  $("progress").textContent = answered === 5 ? t.complete : t.answered(answered);
  ["b0", "b1", "b2"].forEach((id, k) => $(id).classList.toggle("on", band === k));
  $("marker").style.left = `calc(${(total / 10) * 100}% - 2px)`;

  const view = band === null ? t.pending : t.bands[band];
  $("pill").className = "pill " + (band === null ? "none" : ["good", "warn", "bad"][band]);
  $("pill").textContent = view.pill;
  $("verdict").textContent = view.verdict;
  $("reco").textContent = view.reco;
  $("next").textContent = view.next;

  const risks = riskIndexes(state.answers);
  $("risks").innerHTML = risks.length
    ? risks.map((r) => `<li><span class="dot v${r.v}"></span><span><strong>${t.questions[r.i].area}.</strong> ${t.questions[r.i].risk}</span></li>`).join("")
    : `<li><span class="empty">${t.noRisks}</span></li>`;

  const fi = focusIndex();
  const showPilot = band !== null && band > 0 && fi !== null;
  $("focus-box").hidden = !(band !== null && band > 0);
  $("pilot-box").hidden = !showPilot;
  $("pilot").textContent = showPilot ? t.questions[fi].pilot : "";
}

function applyLang() {
  const t = T(), s = t.send;
  document.documentElement.lang = lang;
  const text = {
    "t-eyebrow": t.eyebrow, "t-title": t.title, "t-lede": t.lede, "btn-restart": t.restart,
    "t-result": t.result, "t-next": t.next, "t-risks": t.risks, "t-focus": t.focus, "t-pilot": t.pilot, "t-tosend": t.toSend,
    "t-sendtitle": s.title, "t-sendtext": s.text, "t-name": s.name, "t-company": s.company, "t-email": s.email,
    "t-phone": s.phone, "t-message": s.message, "btn-send": s.button, "t-privacy": s.privacy,
    "t-fallback": s.fallback, "t-openmail": s.openMail, "btn-copy": s.copy
  };
  Object.entries(text).forEach(([id, v]) => { $(id).textContent = v; });
  $("f-message").placeholder = s.messagePh;
  $("howto").innerHTML = t.howto.map((x) => `<li><span>${x}</span></li>`).join("");
  document.title = t.title;
  LANGS.forEach((l) => $(`lang-${l}`).setAttribute("aria-pressed", l === lang ? "true" : "false"));
  ["err", "ok"].forEach((id) => { $(id).hidden = true; });
  $("fallback").hidden = true;
  renderQuestions();
  renderFocusOptions();
  renderResult();
}

function setLang(l) {
  if (!LANGS.includes(l)) return;
  lang = l;
  if (location.hash !== `#${l}`) history.replaceState(null, "", `#${l}`);
  applyLang();
}

function buildMessage() {
  const t = T(), L = t.send.labels;
  const { total, band } = evaluate(state.answers);
  const fi = focusIndex();
  const lines = [
    `${L.name}: ${$("f-name").value.trim()}`,
    `${L.company}: ${$("f-company").value.trim() || "-"}`,
    `${L.email}: ${$("f-email").value.trim()}`,
    `${L.phone}: ${$("f-phone").value.trim() || "-"}`,
    "",
    `${L.score}: ${total} / 10`,
    `${L.result}: ${t.bands[band].pill}`,
  ];
  if (band > 0 && fi !== null) lines.push(`${L.worry}: ${t.questions[fi].area}`, `${L.start}: ${t.questions[fi].pilot}`);
  lines.push("", `${L.answers}:`);
  t.questions.forEach((q, i) => lines.push(`${i + 1}. ${q.text}\n   → ${q.opts[state.answers[i]]}`));
  const msg = $("f-message").value.trim();
  if (msg) lines.push("", `${L.message}:`, msg);
  lines.push("", `Language: ${lang.toUpperCase()}`);
  return lines.join("\n");
}

function showError(text) {
  $("err").textContent = text;
  $("err").hidden = false;
  $("ok").hidden = true;
}

async function trySend(payload) {
  if (!WEB3FORMS_KEY) return false;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const res = await fetch(SEND_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ access_key: WEB3FORMS_KEY, ...payload }),
      signal: ctrl.signal
    });
    const data = await res.json().catch(() => ({}));
    return res.ok && data.success === true;
  } catch (err) {
    return false;
  } finally {
    clearTimeout(timer);
  }
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const t = T(), s = t.send;
  $("fallback").hidden = true;
  if (evaluate(state.answers).answered < 5) { showError(s.needAnswers); return; }
  const name = $("f-name").value.trim();
  const email = $("f-email").value.trim();
  if (!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError(s.needContact); return; }
  $("err").hidden = true;
  if ($("h-bot").checked) return;

  const { total, band } = evaluate(state.answers);
  const fi = focusIndex();
  const subject = `${s.subject}: ${$("f-company").value.trim() || name} (${total}/10)`;
  const payload = {
    subject, from_name: "Company self-check", replyto: email,
    name, email,
    company: $("f-company").value.trim() || "-",
    phone: $("f-phone").value.trim() || "-",
    message: $("f-message").value.trim() || "-",
    score: `${total} / 10`,
    result: t.bands[band].pill,
    main_concern: band > 0 && fi !== null ? `${t.questions[fi].area}: ${t.questions[fi].pilot}` : "-",
    answers: t.questions.map((q, i) => `${i + 1}. ${q.text} → ${q.opts[state.answers[i]]}`).join("\n"),
    language: lang.toUpperCase()
  };

  const btn = $("btn-send");
  btn.disabled = true;
  btn.textContent = s.sending;
  const sent = await trySend(payload);
  btn.disabled = false;
  btn.textContent = s.button;

  if (sent) {
    location.href = `thanks.html?lang=${lang}`;
    return;
  }
  const body = buildMessage();
  $("mailto").href = `mailto:${OWNER_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  $("mailto").dataset.body = body;
  $("copy-status").textContent = "";
  $("fallback").hidden = false;
});

$("btn-copy").addEventListener("click", async () => {
  const s = T().send;
  try {
    await navigator.clipboard.writeText($("mailto").dataset.body || buildMessage());
    $("copy-status").textContent = s.copied;
  } catch (err) {
    $("copy-status").textContent = s.copyFail;
  }
});

$("btn-restart").addEventListener("click", () => {
  state = { answers: [null, null, null, null, null], focus: "auto" };
  $("form").reset();
  ["err", "ok"].forEach((id) => { $(id).hidden = true; });
  renderQuestions();
  renderFocusOptions();
  renderResult();
  window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
});

$("to-send").addEventListener("click", () => { $("send-form").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); $("f-name").focus({ preventScroll: true }); });
LANGS.forEach((l) => $(`lang-${l}`).addEventListener("click", () => setLang(l)));
window.addEventListener("hashchange", () => setLang(location.hash.slice(1)));
$("f-focus").addEventListener("change", (e) => { state.focus = e.target.value; renderResult(); });

const initial = location.hash.slice(1);
lang = LANGS.includes(initial) ? initial : "en";
applyLang();
</script>
</body>
